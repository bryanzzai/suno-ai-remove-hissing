name: Build Windows application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install packaging Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build portable Windows folder
        shell: pwsh
        run: .\BUILD_PORTABLE.ps1 -Output "$env:GITHUB_WORKSPACE\dist\SunoAiRemoveHissing-Portable"

      - name: Upload portable Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: SunoAiRemoveHissing-Portable-win-x64
          path: dist/SunoAiRemoveHissing-Portable
          if-no-files-found: error
